<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top Stocks by Total Return</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Inter", sans-serif;
      margin: 20px;
      background: white;
      color: #111827;
    }
    #chart { width: 100%; height: 460px; }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    const allStocks = [
      { ticker: "NVDA", name: "NVIDIA",         sector: "Technology",              ret: 662 },
      { ticker: "META", name: "Meta",            sector: "Communication Services",  ret: 280 },
      { ticker: "LLY",  name: "Eli Lilly",       sector: "Health Care",             ret: 210 },
      { ticker: "JPM",  name: "JPMorgan Chase",  sector: "Financials",              ret: 110 },
      { ticker: "TSLA", name: "Tesla",           sector: "Consumer Discretionary",  ret: 95  },
      { ticker: "AMD",  name: "AMD",             sector: "Technology",              ret: 89  },
      { ticker: "AMZN", name: "Amazon",          sector: "Consumer Discretionary",  ret: 72  },
      { ticker: "GOOG", name: "Alphabet",        sector: "Communication Services",  ret: 65  },
      { ticker: "MSFT", name: "Microsoft",       sector: "Technology",              ret: 60  },
      { ticker: "AAPL", name: "Apple",           sector: "Technology",              ret: 58  },
      { ticker: "XOM",  name: "Exxon Mobil",     sector: "Energy",                  ret: 45  }
    ];

    const sectorColors = {
      "Technology":             "#2563eb",
      "Communication Services": "#7c3aed",
      "Health Care":            "#059669",
      "Financials":             "#d97706",
      "Consumer Discretionary": "#dc2626",
      "Energy":                 "#0891b2"
    };

    const sorted = [...allStocks].sort((a, b) => b.ret - a.ret);

    // One trace per sector for proper legend
    const sectors = [...new Set(sorted.map(s => s.sector))];
    const traces = sectors.map(sector => {
      const stocks = sorted.filter(s => s.sector === sector);
      return {
        type: "bar",
        name: sector,
        x: stocks.map(s => s.ticker),
        y: stocks.map(s => s.ret),
        text: stocks.map(s => `${s.ret}%`),
        textposition: "outside",
        marker: { color: sectorColors[sector], line: { width: 0 } },
        hovertemplate: "<b>%{x} — %{customdata[0]}</b><br>Sector: " + sector + "<br>Total Return: <b>%{y}%</b><extra></extra>",
        customdata: stocks.map(s => [s.name])
      };
    });

    const layout = {
      title: {
        text: "All Stocks Ranked by Total Return (2022–2025)",
        font: { size: 16, family: "Inter" }
      },
      xaxis: {
        title: "Ticker",
        tickfont: { size: 13 },
        categoryorder: "array",
        categoryarray: sorted.map(s => s.ticker)
      },
      yaxis: {
        title: "Total Return (%)",
        tickfont: { size: 13 },
        rangemode: "tozero"
      },
      legend: {
        title: { text: "Sector" },
        orientation: "v",
        x: 1.02,
        y: 1
      },
      plot_bgcolor: "white",
      paper_bgcolor: "white",
      margin: { t: 60, r: 200, b: 60, l: 70 },
      font: { family: "Inter" },
      barmode: "group"
    };

    Plotly.newPlot("chart", traces, layout, { responsive: true, displayModeBar: false });
  </script>
</body>
</html>
