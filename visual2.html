<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top Stocks by Sector</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Inter", sans-serif; margin: 20px; background: white; color: #111827; }
    .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    label { font-weight: 600; font-size: 14px; color: #374151; }
    select {
      padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 14px; font-family: "Inter", sans-serif; background: white;
      color: #111827; cursor: pointer;
    }
    select:focus { outline: none; border-color: #38bdf8; }
    #chart { width: 100%; height: 420px; }
  </style>
</head>
<body>
  <div class="controls">
    <label for="sectorSelect">Select Sector:</label>
    <select id="sectorSelect">
      <option value="Technology">Technology</option>
      <option value="Communication Services">Communication Services</option>
      <option value="Consumer Discretionary">Consumer Discretionary</option>
      <option value="Financials">Financials</option>
      <option value="Health Care">Health Care</option>
      <option value="Energy">Energy</option>
    </select>
  </div>
  <div id="chart"></div>

  <script>
    const stockData = {
      "Technology": [
        { ticker: "NVDA", name: "NVIDIA",    ret: 662 },
        { ticker: "AMD",  name: "AMD",       ret: 89  },
        { ticker: "MSFT", name: "Microsoft", ret: 60  },
        { ticker: "AAPL", name: "Apple",     ret: 58  }
      ],
      "Communication Services": [
        { ticker: "META", name: "Meta",    ret: 280 },
        { ticker: "GOOG", name: "Alphabet", ret: 65 }
      ],
      "Consumer Discretionary": [
        { ticker: "TSLA", name: "Tesla",  ret: 95 },
        { ticker: "AMZN", name: "Amazon", ret: 72 }
      ],
      "Financials": [
        { ticker: "JPM", name: "JPMorgan Chase", ret: 110 }
      ],
      "Health Care": [
        { ticker: "LLY", name: "Eli Lilly", ret: 210 }
      ],
      "Energy": [
        { ticker: "XOM", name: "Exxon Mobil", ret: 45 }
      ]
    };

    const colors = ["#2563eb","#3b82f6","#60a5fa","#93c5fd","#1d4ed8","#1e40af"];

    function renderChart(sector) {
      const stocks = [...(stockData[sector] || [])].sort((a, b) => b.ret - a.ret);
      Plotly.newPlot("chart", [{
        type: "bar",
        x: stocks.map(s => s.ticker),
        y: stocks.map(s => s.ret),
        text: stocks.map(s => `${s.ret}%`),
        textposition: "outside",
        marker: { color: stocks.map((_, i) => colors[i % colors.length]) },
        hovertemplate: "<b>%{x}</b><br>%{customdata}<br>Total Return: <b>%{y}%</b><extra></extra>",
        customdata: stocks.map(s => s.name)
      }], {
        title: { text: `Top Stocks in ${sector} by Total Return (2022–2025)`, font: { size: 16, family: "Inter" } },
        xaxis: { title: "Ticker", tickfont: { size: 13 } },
        yaxis: { title: "Total Return (%)", rangemode: "tozero", tickfont: { size: 13 } },
        plot_bgcolor: "white",
        paper_bgcolor: "white",
        margin: { t: 60, r: 30, b: 60, l: 70 },
        font: { family: "Inter" },
        showlegend: false
      }, { responsive: true, displayModeBar: false });
    }

    const select = document.getElementById("sectorSelect");
    renderChart(select.value);
    select.addEventListener("change", () => renderChart(select.value));
  </script>
</body>
</html>
