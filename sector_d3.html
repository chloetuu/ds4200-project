<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>D3 Sector Performance</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Inter", sans-serif;
      margin: 30px;
    }

    .tooltip {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      padding: 8px;
      border-radius: 5px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
    }

    .line {
      fill: none;
      stroke-width: 2;
    }

    .legend {
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h2>Interactive Sector Trends Explorer</h2>
  <p>Explore how sector ETFs performed over time. Hover for details and click the legend to hide or show sectors.</p>
  <p><strong>Key takeaway:</strong> Technology began to separate from most other sectors after 2023, reflecting the strength of AI-driven market growth.</p>

  <svg width="1200" height="550"></svg>
  <div class="tooltip"></div>

  <script>
    const svg = d3.select("svg");
    const tooltip = d3.select(".tooltip");

    const margin = { top: 50, right: 220, bottom: 50, left: 70 };
    const width = 1200 - margin.left - margin.right;
    const height = 550 - margin.top - margin.bottom;

    const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    d3.csv("monthly_prices_long.csv").then(data => {
      data.forEach(d => {
        d.Date = new Date(d.Date);
        d.Base100_Monthly = +d.Base100_Monthly;
      });

      const grouped = d3.groups(data, d => d.Sector);

      const x = d3.scaleTime()
        .domain(d3.extent(data, d => d.Date))
        .range([0, width]);

      const y = d3.scaleLinear()
        .domain([
          d3.min(data, d => d.Base100_Monthly) * 0.95,
          d3.max(data, d => d.Base100_Monthly) * 1.05
        ])
        .range([height, 0]);

      const color = d3.scaleOrdinal()
        .domain(grouped.map(d => d[0]))
        .range(d3.schemeTableau10);

      const line = d3.line()
        .x(d => x(d.Date))
        .y(d => y(d.Base100_Monthly));

      g.append("g")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(x));

      g.append("g")
        .call(d3.axisLeft(y));

      g.append("text")
        .attr("x", width / 2)
        .attr("y", -20)
        .attr("text-anchor", "middle")
        .style("font-size", "20px")
        .style("font-weight", "600")
        .text("Sector ETF Performance Over Time (Base 100)");

      g.append("text")
        .attr("x", width / 2)
        .attr("y", height + 40)
        .attr("text-anchor", "middle")
        .text("Date");

      g.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -50)
        .attr("text-anchor", "middle")
        .text("Index (Base 100)");

      const sectorLines = g.selectAll(".sector-line")
        .data(grouped)
        .enter()
        .append("path")
        .attr("class", "line sector-line")
        .attr("stroke", d => color(d[0]))
        .attr("d", d => line(d[1]))
        .attr("id", d => d[0].replace(/\s+/g, ""));

      sectorLines
        .on("mouseover", function(event, d) {
          d3.select(this).attr("stroke-width", 4);
        })
        .on("mousemove", function(event, d) {
          const [mx] = d3.pointer(event, g.node());

          const dates = d[1];
          const xDate = x.invert(mx);

          const bisect = d3.bisector(e => e.Date).left;
          const index = bisect(dates, xDate);
          const point = dates[Math.min(index, dates.length - 1)];

          tooltip
            .style("opacity", 1)
            .html(`
              <strong>${d[0]}</strong><br>
              Date: ${point.Date.toLocaleDateString()}<br>
              Index: ${point.Base100_Monthly.toFixed(2)}
            `)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 20) + "px");
        })
        .on("mouseout", function() {
          d3.select(this).attr("stroke-width", 2);
          tooltip.style("opacity", 0);
        });

      const legend = svg.selectAll(".legend")
        .data(grouped)
        .enter()
        .append("g")
        .attr("class", "legend")
        .attr("transform", (d, i) => `translate(${width + 110}, ${80 + i * 22})`)
        .on("click", function(event, d) {
          const id = d[0].replace(/\s+/g, "");
          const selectedLine = d3.select(`#${id}`);
          const isHidden = selectedLine.style("display") === "none";

          if (isHidden) {
            selectedLine.style("display", null);
            d3.select(this).style("opacity", 1);
          } else {
            selectedLine.style("display", "none");
            d3.select(this).style("opacity", 0.4);
          }
        });

      legend.append("rect")
        .attr("width", 12)
        .attr("height", 12)
        .attr("fill", d => color(d[0]));

      legend.append("text")
        .attr("x", 18)
        .attr("y", 10)
        .text(d => d[0]);
    });
  </script>
</body>
</html>
