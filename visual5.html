<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>D3 Sector Performance</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: "Inter", sans-serif;
      margin: 0;
      background: white;
      color: #111827;
    }
    .tooltip {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      padding: 8px;
      border-radius: 5px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .line { fill: none; stroke-width: 2.5; }
    .legend { cursor: pointer; font-size: 13px; }
    .axis-label { font-size: 14px; fill: #111827; }
    .chart-title { font-size: 20px; font-weight: 600; fill: #111827; }
    .event-label { font-size: 10px; fill: #6b7280; }
    .event-line { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 4,3; }
  </style>
</head>
<body>
  <svg width="100%" height="580" viewBox="0 0 1200 580"></svg>
  <div class="tooltip"></div>

  <script>
    const svg = d3.select("svg");
    const tooltip = d3.select(".tooltip");

    const margin = { top: 60, right: 220, bottom: 80, left: 80 };
    const width = 1200 - margin.left - margin.right;
    const height = 580 - margin.top - margin.bottom;

    const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const events = [
      { date: new Date("2022-06-16"), label: "Fed rate hike (Jun '22)", offset: 4  },
      { date: new Date("2022-10-12"), label: "Market bottom (Oct '22)", offset: 26 },
      { date: new Date("2022-11-30"), label: "ChatGPT launched",        offset: 48 },
      { date: new Date("2023-07-01"), label: "AI rally accelerates",    offset: 4  },
      { date: new Date("2024-01-01"), label: "AI boom peak",            offset: 26 }
    ];

    d3.csv("monthly_prices_long.csv").then(data => {
      data.forEach(d => {
        d.Date = new Date(d.Date);
        d.Base100_Monthly = +d.Base100_Monthly;
      });

      const sectorData = data.filter(d =>
        d.Sector && !isNaN(d.Base100_Monthly)
      );

      sectorData.sort((a, b) => a.Date - b.Date);

      const grouped = d3.groups(sectorData, d => d.Sector)
        .map(([sector, values]) => [
          sector,
          values.sort((a, b) => a.Date - b.Date)
        ]);

      const x = d3.scaleTime()
        .domain(d3.extent(sectorData, d => d.Date))
        .range([0, width]);

      const y = d3.scaleLinear()
        .domain([
          d3.min(sectorData, d => d.Base100_Monthly) * 0.95,
          d3.max(sectorData, d => d.Base100_Monthly) * 1.05
        ])
        .nice()
        .range([height, 0]);

      const color = d3.scaleOrdinal()
        .domain(grouped.map(d => d[0]))
        .range(d3.schemeTableau10);

      const line = d3.line()
        .x(d => x(d.Date))
        .y(d => y(d.Base100_Monthly));

      // Axes
      g.append("g")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(x));

      g.append("g")
        .call(d3.axisLeft(y));

      // Title
      g.append("text")
        .attr("class", "chart-title")
        .attr("x", width / 2)
        .attr("y", -30)
        .attr("text-anchor", "middle")
        .text("Sector ETF Performance Over Time (Base 100)");

      // Axis labels
      g.append("text")
        .attr("class", "axis-label")
        .attr("x", width / 2)
        .attr("y", height + 50)
        .attr("text-anchor", "middle")
        .text("Date");

      g.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -55)
        .attr("text-anchor", "middle")
        .text("Index (Base 100)");

      // Event annotation lines + labels
      events.forEach(ev => {
        const xPos = x(ev.date);
        if (xPos < 0 || xPos > width) return;

        // Vertical dashed line
        g.append("line")
          .attr("class", "event-line")
          .attr("x1", xPos).attr("x2", xPos)
          .attr("y1", 0).attr("y2", height);

        // Label staggered by offset to avoid overlap
        g.append("text")
          .attr("class", "event-label")
          .attr("x", xPos + 3)
          .attr("y", ev.offset)
          .text(ev.label);
      });

      // Sector lines
      const sectorLines = g.selectAll(".sector-line")
        .data(grouped)
        .enter()
        .append("path")
        .attr("class", "line sector-line")
        .attr("stroke", d => color(d[0]))
        .attr("d", d => line(d[1]))
        .attr("id", d => d[0].replace(/\s+/g, ""));

      sectorLines
        .on("mouseover", function() {
          d3.select(this).attr("stroke-width", 4);
        })
        .on("mousemove", function(event, d) {
          const [mx] = d3.pointer(event, g.node());
          const xDate = x.invert(mx);
          const bisect = d3.bisector(e => e.Date).center;
          const idx = bisect(d[1], xDate);
          const point = d[1][Math.max(0, Math.min(idx, d[1].length - 1))];
          tooltip
            .style("opacity", 1)
            .html(`<strong>${d[0]}</strong><br>Date: ${point.Date.toLocaleDateString()}<br>Index: ${point.Base100_Monthly.toFixed(2)}`)
            .style("left", `${event.pageX + 10}px`)
            .style("top", `${event.pageY - 20}px`);
        })
        .on("mouseout", function() {
          d3.select(this).attr("stroke-width", 2.5);
          tooltip.style("opacity", 0);
        });

      // Legend
      const legend = svg.selectAll(".legend")
        .data(grouped)
        .enter()
        .append("g")
        .attr("class", "legend")
        .attr("transform", (d, i) =>
          `translate(${width + margin.left + 30}, ${margin.top + 20 + i * 24})`
        )
        .on("click", function(event, d) {
          const id = d[0].replace(/\s+/g, "");
          const selectedLine = d3.select(`#${id}`);
          const isHidden = selectedLine.style("display") === "none";
          if (isHidden) {
            selectedLine.style("display", null);
            d3.select(this).style("opacity", 1);
          } else {
            selectedLine.style("display", "none");
            d3.select(this).style("opacity", 0.4);
          }
        });

      legend.append("rect")
        .attr("width", 12).attr("height", 12)
        .attr("fill", d => color(d[0]));

      legend.append("text")
        .attr("x", 18).attr("y", 10)
        .text(d => d[0]);

    }).catch(error => {
      console.error("Error loading CSV:", error);
    });
  </script>
</body>
</html>
